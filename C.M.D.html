<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <title>Client Management Dashboard</title>

    <!-- ===== CSS ===== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 20px;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            flex: 1;
            border-radius: 8px;
            text-align: center;
            min-width: 150px;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 10px;
            flex: 1;
            min-width: 150px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .pending {
            color: orange;
            font-weight: bold;
        }

        .delete-btn {
            background: red;
            padding: 6px 1opx;
            border-radius: 4px;
            color: white;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <h1>Client Management Dashboard</h1>
    </header>

    <!-- ===== STATS ===== -->
    <section class="stats">
        <div class="card">
            <h3>Total Clients</h3>
            <p id="totalClients">0</p>
        </div>
        <div class="card">
            <h3>Paid</h3>
            <p id="paidClients">0</p>
        </div>
        <div class="card">
            <h3>Pending</h3>
            <p id="pendingClients">0</p>
        </div>
    </section>

    <!-- ===== ADD CLIENT ===== -->
    <section class="section">
        <h2>Add New Client</h2>
        <form id="clientForm">
            <input type="text" id="clientName" placeholder="Client Name" required>
            <input type="number" id="clientAmount" placeholder="Amount (R)" required>
            <select id="clientStatus">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
            </select>
            <button type="submit">Add Client</button>
        </form>
    </section>

    <!-- ===== CLIENT TABLE ===== -->
    <section class="section">
        <h2>Clients</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount (R)</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="clientTable"></tbody>
        </table>
    </section>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        const clientForm = document.getElementById("clientForm");
        const clientTable  = document.getElementById("clientTable");

        const totalClients = document.getElementById("totalClients");
        const paidClients = document.getElementById("paidClients");
        const pendingClients = document.getElementById("pendingClients");

        let clients = []

        function loadClients() {
            const stored = localStorage.getItem("clients");
            if (stored) {
                clients = JSON.parse(stored);
                renderClients();
            }
        }

        function saveClients() {
            localStorage.setItem("clients", JSON.stringify(clients));
        }

        function renderClients() {
            clientTable.innerHTML ="";

            clients.forEach((client, index) => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${client.name}</td>
                    <td>${client.amount}</td>
                    <td class="${client.status === 'paid' ? 'paid' : 'pending'}">
                        ${client.status}
                    </td>
                    <td>
                        <button class="delete-btn" onclick="deleteClient(${index})">
                            delete
                            </button>
                        </td>
                        `;

                        clientTable.appendChild(row);
            });

            updateStatus();
        }

        function updateStatus() {
            totalClients.textContent = clients.length;
            paidClients.textContent = clients.filter(c => c.status === "Paid").length;
            pendingClients.textContent = clients.filter(c => c.status === "Pending").length;
        }
        
        clientForm.addEventListener("submit", function(e){
            e.preventDefault();

            const name = clientName.value;
            const amount = clientAmount.value;
            const status = clientStatus.value;

            clients.push({name, amount, status});
            saveClients();
            renderClients();
            clientForm.reset();
        });
        function deleteClient(index) {
            clients.splice(index, 1);
            saveClients();
            renderClients();
        }

        loadClients();
    </script>
</body>
